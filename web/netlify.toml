[build]
  command = "npm run build"
  publish = "dist"

# La app maneja sus propias rutas (/mesas, /m/<código del QR>): todo va a index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Encabezados de seguridad
#  - CSP: el sitio solo carga código propio; habla con Supabase y con Google Fonts.
#  - No se puede meter la app dentro de otra página (clickjacking).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
